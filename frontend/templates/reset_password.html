<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Đặt mật khẩu mới bằng mã đặt lại mật khẩu của bạn.">
  <title>Đặt lại mật khẩu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='recovery.css') }}">
</head>
<body>
  {% include '_nav.html' %}

  <div class="rp-wrapper">
    <div class="rp-card">

      <!-- Icon badge -->
      <div class="rp-icon-badge purple">🔑</div>

      <!-- Header -->
      <div class="rp-tag">Password Recovery</div>
      <h1>Reset Password</h1>
      <p class="rp-subtitle">
        Paste your reset token and choose a strong new password for your account.
      </p>

      <!-- Form -->
      <form id="resetPasswordForm" novalidate>

        <!-- Token field -->
        <div class="rp-field">
          <label for="token"><span class="lbl-icon">🎟️</span> Reset Token</label>
          <div class="rp-input-wrap">
            <textarea
              id="token"
              name="token"
              required
              placeholder="Paste your reset token here…"
            >{{ token }}</textarea>
          </div>
        </div>

        <!-- New password -->
        <div class="rp-field">
          <label for="password"><span class="lbl-icon">🔒</span> New Password</label>
          <div class="rp-input-wrap">
            <input
              id="password"
              name="password"
              type="password"
              required
              autocomplete="new-password"
              placeholder="At least 8 characters"
              class="has-toggle"
            >
            <button type="button" class="rp-eye-btn" id="togglePassword" aria-label="Toggle password visibility">👁️</button>
          </div>
          <!-- Strength meter -->
          <div class="strength-bar" id="strengthBar" aria-hidden="true">
            <div class="strength-seg" id="seg1"></div>
            <div class="strength-seg" id="seg2"></div>
            <div class="strength-seg" id="seg3"></div>
            <div class="strength-seg" id="seg4"></div>
          </div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>

        <!-- Confirm password -->
        <div class="rp-field">
          <label for="passwordconfirm"><span class="lbl-icon">✅</span> Confirm Password</label>
          <div class="rp-input-wrap">
            <input
              id="passwordconfirm"
              name="passwordconfirm"
              type="password"
              required
              autocomplete="new-password"
              placeholder="Re-enter your new password"
              class="has-toggle"
            >
            <button type="button" class="rp-eye-btn" id="toggleConfirm" aria-label="Toggle confirm password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="rp-btn primary" style="margin-top: 8px;">
          <span class="spin"></span>
          <span class="btn-text">Reset Password →</span>
        </button>

      </form>

      <!-- Status message -->
      <div id="message" class="rp-alert" role="alert">
        <span class="alert-icon" id="msgIcon"></span>
        <span id="msgText"></span>
      </div>

    </div><!-- /.rp-card -->

    <!-- Back link -->
    <p class="rp-back">
      Remembered it? <a href="{{ url_for('auth.login_page') }}">Back to Login</a>
    </p>
  </div><!-- /.rp-wrapper -->

  <script src="{{ url_for('static', filename='api_client.js') }}"></script>
  <script src="{{ url_for('static', filename='reset_password.js') }}"></script>

  <!-- Password strength + eye toggle (inline, no extra file needed) -->
  <script>
    /* ── Eye toggle ────────────────────────────────────────── */
    function makeToggle(btnId, inputId) {
      const btn   = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      if (!btn || !input) return;
      btn.addEventListener('click', () => {
        const isPass = input.type === 'password';
        input.type  = isPass ? 'text' : 'password';
        btn.textContent = isPass ? '🙈' : '👁️';
      });
    }
    makeToggle('togglePassword', 'password');
    makeToggle('toggleConfirm', 'passwordconfirm');

    /* ── Password strength meter ───────────────────────────── */
    const pwdInput     = document.getElementById('password');
    const segs         = [1,2,3,4].map(n => document.getElementById('seg' + n));
    const strengthLbl  = document.getElementById('strengthLabel');
    const levels       = [
      { min: 0,  label: '',          cls: ''   },
      { min: 1,  label: 'Weak',      cls: 's1' },
      { min: 2,  label: 'Fair',      cls: 's2' },
      { min: 3,  label: 'Good',      cls: 's3' },
      { min: 4,  label: 'Strong 💪', cls: 's4' },
    ];
    const labelColors = ['', '#f43f5e', '#f97316', '#eab308', '#10b981'];

    function getScore(pwd) {
      let score = 0;
      if (pwd.length >= 8)              score++;
      if (/[A-Z]/.test(pwd))           score++;
      if (/[0-9]/.test(pwd))           score++;
      if (/[^A-Za-z0-9]/.test(pwd))    score++;
      return score;
    }

    if (pwdInput) {
      pwdInput.addEventListener('input', () => {
        const score = getScore(pwdInput.value);
        segs.forEach((s, i) => {
          s.className = 'strength-seg';
          if (i < score) s.classList.add(levels[score].cls);
        });
        strengthLbl.textContent = pwdInput.value ? levels[score].label : '';
        strengthLbl.style.color = labelColors[score];
      });
    }
  </script>
</body>
</html>
