<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an Account - Analog Contest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
  <style>
    /* ===== DARK MODE STYLING ===== */
    body {
      background: #080c14 !important;
      color: #e8edf2 !important;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 80px);
      padding: 30px 20px;
    }

    .auth-card {
      background: #111a26;
      border: 1px solid #1e2a3a;
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }
    .auth-card:hover {
      border-color: #f5a623;
      box-shadow: 0 20px 60px rgba(245, 166, 35, 0.08);
    }

    .auth-card .eyebrow {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #f5a623;
      font-weight: 600;
      margin: 0 0 6px;
    }

    .auth-card h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f0f4f8;
      margin: 0 0 22px;
    }

    .auth-card form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-card label {
      font-weight: 600;
      color: #99abb8;
      font-size: 0.88rem;
      margin-bottom: 2px;
    }

    .auth-card input[type="text"],
    .auth-card input[type="email"],
    .auth-card input[type="password"],
    .auth-card select {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid #1e2a3a;
      border-radius: 12px;
      font-size: 0.95rem;
      background: #0d1622;
      color: #e8edf2;
      transition: all 0.3s ease;
      box-sizing: border-box;
      font-family: inherit;
    }

    .auth-card select {
      cursor: pointer;
    }

    .auth-card select option {
      background: #111a26;
      color: #e8edf2;
    }

    .auth-card input[type="text"]:focus,
    .auth-card input[type="email"]:focus,
    .auth-card input[type="password"]:focus,
    .auth-card select:focus {
      border-color: #f5a623;
      box-shadow: 0 0 0 4px rgba(245, 166, 35, 0.12);
      outline: none;
      background: #0d1622;
      color: #e8edf2;
    }

    .auth-card input::placeholder {
      color: #5d6f83;
    }

    .field-hint {
      font-size: 0.78rem;
      color: #6b7f94;
      margin-top: -8px;
    }

    /* ===== BUTTON ===== */
    .auth-card button[type="submit"] {
      width: 100%;
      padding: 13px;
      background: #f5a623;
      color: #080c14;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 6px;
      font-family: inherit;
    }

    .auth-card button[type="submit"]:hover {
      background: #e0960a;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(245, 166, 35, 0.3);
    }

    .auth-card button[type="submit"]:active {
      transform: translateY(0);
    }

    /* ===== MESSAGE ===== */
    .auth-card .message {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }

    .auth-card .message.error {
      display: block;
      background: rgba(220, 38, 38, 0.12);
      color: #f87171;
      border: 1px solid rgba(220, 38, 38, 0.25);
    }

    .auth-card .message.success {
      display: block;
      background: rgba(245, 166, 35, 0.12);
      color: #f5a623;
      border: 1px solid rgba(245, 166, 35, 0.25);
    }

    .auth-card .message.info {
      display: block;
      background: rgba(56, 189, 248, 0.12);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    /* ===== SECONDARY TEXT ===== */
    .auth-card .secondary-text {
      margin-top: 20px;
      text-align: center;
      color: #8899aa;
      font-size: 0.9rem;
    }

    .auth-card .secondary-text a {
      color: #f5a623;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .auth-card .secondary-text a:hover {
      color: #e0960a;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 24px 18px;
      }
      .auth-card h1 {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  {% include '_nav.html' %}
  <div class="auth-container">
    <div class="auth-card">
      <p class="eyebrow">ANALOG CONTEST</p>
      <h1>Create an Account</h1>
      <form id="registerForm" novalidate>
        <div>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" required autocomplete="username" placeholder="Choose a username">
        </div>

        <div>
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="name@example.com">
        </div>

        <div>
          <label for="full_name">Full Name</label>
          <input id="full_name" name="full_name" type="text" autocomplete="name" placeholder="Enter your full name">
        </div>

        <div>
          <label for="role">Account Role</label>
          <select id="role" name="role">
            <option value="participant">Participant (Submit works & compete)</option>
            <option value="organizer">Organizer (Create & manage contests)</option>
            <option value="judge">Judge (Evaluate submissions)</option>
            <option value="admin">Administrator (System management)</option>
          </select>
        </div>

        <div>
          <label for="password">Password</label>
          <div style="position: relative; display: flex; align-items: center; width: 100%;">
            <input id="password" name="password" type="password" required autocomplete="new-password" placeholder="Create a strong password" style="padding-right: 44px;">
            <button type="button" id="togglePasswordBtn" title="Show/Hide password" style="position: absolute; right: 10px; background: transparent; border: none; color: #8899aa; cursor: pointer; font-size: 1.15rem; width: auto; padding: 4px; margin: 0;">👁️</button>
          </div>
        </div>

        <div>
          <label for="passwordconfirm">Confirm Password</label>
          <div style="position: relative; display: flex; align-items: center; width: 100%;">
            <input id="passwordconfirm" name="passwordconfirm" type="password" required autocomplete="new-password" placeholder="Re-enter your password" style="padding-right: 44px;">
            <button type="button" id="togglePasswordConfirmBtn" title="Show/Hide password" style="position: absolute; right: 10px; background: transparent; border: none; color: #8899aa; cursor: pointer; font-size: 1.15rem; width: auto; padding: 4px; margin: 0;">👁️</button>
          </div>
        </div>

        <button type="submit">Create Account</button>
      </form>

      <script>
        document.addEventListener('DOMContentLoaded', function() {
          function setupToggle(btnId, inputId) {
            const toggleBtn = document.getElementById(btnId);
            const passInput = document.getElementById(inputId);
            if (toggleBtn && passInput) {
              toggleBtn.addEventListener('click', function() {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                toggleBtn.textContent = isPass ? '🙈' : '👁️';
              });
            }
          }
          setupToggle('togglePasswordBtn', 'password');
          setupToggle('togglePasswordConfirmBtn', 'passwordconfirm');
        });
      </script>

      <div id="message" class="message"></div>

      <p class="secondary-text">Already have an account? <a href="{{ url_for('auth.login_page') }}">Log In</a></p>
    </div>
  </div>
  <script src="{{ url_for('static', filename='api_client.js') }}"></script>
  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
