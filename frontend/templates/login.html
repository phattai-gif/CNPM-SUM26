<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
  <style>
    /* ===== DARK MODE OVERRIDES ===== */
    body {
      background: #080c14 !important;
      color: #e8edf2 !important;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 80px);
      padding: 20px;
    }

    .auth-card {
      background: #111a26;
      border: 1px solid #1e2a3a;
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }
    .auth-card:hover {
      border-color: #f5a623;
      box-shadow: 0 20px 60px rgba(245, 166, 35, 0.06);
    }

    .auth-card .eyebrow {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #f5a623;
      font-weight: 600;
      margin: 0 0 4px;
    }

    .auth-card h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f0f4f8;
      margin: 0 0 24px;
    }

    .auth-card form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-card label {
      font-weight: 600;
      color: #99abb8;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }

    .auth-card input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #1e2a3a;
      border-radius: 12px;
      font-size: 1rem;
      background: #0d1622;
      color: #e8edf2;
      transition: all 0.3s ease;
    }

    .auth-card input:focus {
      border-color: #f5a623;
      box-shadow: 0 0 0 4px rgba(245, 166, 35, 0.12);
      outline: none;
      background: #0d1622;
      color: #e8edf2;
    }

    .auth-card input::placeholder {
      color: #6b7f94;
    }

    .auth-card button {
      width: 100%;
      padding: 12px;
      background: #f5a623;
      color: #080c14;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 4px;
    }

    .auth-card button:hover {
      background: #e0960a;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(245, 166, 35, 0.3);
    }

    .auth-card button:active {
      transform: translateY(0);
    }

    .auth-card .message {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }

    .auth-card .message.error {
      display: block;
      background: rgba(220, 38, 38, 0.12);
      color: #f87171;
      border: 1px solid rgba(220, 38, 38, 0.25);
    }

    .auth-card .message.success {
      display: block;
      background: rgba(245, 166, 35, 0.12);
      color: #f5a623;
      border: 1px solid rgba(245, 166, 35, 0.25);
    }

    .auth-card .secondary-text {
      margin-top: 20px;
      text-align: center;
      color: #8899aa;
      font-size: 0.9rem;
    }

    .auth-card .secondary-text a {
      color: #f5a623;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .auth-card .secondary-text a:hover {
      color: #e0960a;
      text-decoration: underline;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0d1622;
    }
    ::-webkit-scrollbar-thumb {
      background: #f5a623;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #e0960a;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .auth-card {
        padding: 28px 20px;
      }
      .auth-card h1 {
        font-size: 1.3rem;
      }
      .auth-card input {
        padding: 10px 12px;
        font-size: 0.9rem;
      }
      .auth-card button {
        padding: 10px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body data-google-client-id="{{ config.GOOGLE_CLIENT_ID or google_client_id or '' }}">
  {% include '_nav.html' %}
  <div class="auth-container">
    <div class="auth-card">
      <p class="eyebrow">Welcome back</p>
      <h1>Login to your portal</h1>
      <form id="loginForm" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required autocomplete="username" placeholder="Enter your username">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter your password">
        <p style="margin-top: 6px; text-align: right; font-size: 0.9rem;"><a href="{{ url_for('auth.forgot_password_page') }}" style="color: var(--primary-2); text-decoration: none;">Forgot Password?</a></p>

        <button type="submit">Login</button>
      </form>

  {% if config.GOOGLE_CLIENT_ID or google_client_id %}
      <div class="auth-separator">
        <span>Or continue with</span>
      </div>
      <div id="googleBtn" class="google-btn-container"></div>
  {% endif %}

      <div id="message" class="message"></div>
      <p class="secondary-text">Need an account? <a href="{{ url_for('auth.register_page') }}">Create one</a></p>
      <p class="secondary-text" style="margin-top: 8px;">Already registered? <a href="{{ url_for('auth.verify_email_page') }}">Verify your email</a></p>
    </div>
  </div>
  <script>
    window.google_client_id = "{{ google_client_id }}";
  </script>
  {% if config.GOOGLE_CLIENT_ID or google_client_id %}
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  {% endif %}
  <script src="{{ url_for('static', filename='api_client.js') }}"></script>
  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
