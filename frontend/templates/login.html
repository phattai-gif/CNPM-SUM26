<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body data-google-client-id="{{ config.GOOGLE_CLIENT_ID or '' }}">
  {% include '_nav.html' %}
  <div class="auth-container">
    <div class="auth-card">
      <p class="eyebrow">Welcome back</p>
      <h1>Login to your portal</h1>
      <form id="loginForm" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required autocomplete="username" placeholder="Enter your username">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter your password">

        <button type="submit">Login</button>
      </form>

      {% if config.GOOGLE_CLIENT_ID %}
      <div class="oauth-divider">or</div>
      <div id="googleSignInButton"></div>
      {% endif %}

      <div id="message" class="message"></div>
      <p class="secondary-text">Need an account? <a href="{{ url_for('auth.register_page') }}">Create one</a></p>
    </div>
  </div>
  <script src="{{ url_for('static', filename='api_client.js') }}"></script>
  {% if config.GOOGLE_CLIENT_ID %}
  <script src="https://accounts.google.com/gsi/client" async defer onload="window.initializeGoogleSignIn && window.initializeGoogleSignIn()"></script>
  {% endif %}
  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
