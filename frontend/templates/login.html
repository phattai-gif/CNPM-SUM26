<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
  <style>
    body {
      background: #080c14 !important;
      color: #e8edf2 !important;
      min-height: 100vh;
      font-family: 'Be Vietnam Pro', Inter, system-ui, sans-serif;
    }

    .auth-card {
      padding: 34px 30px;
      max-width: 420px;
    }

    .auth-card h1 {
      margin-bottom: 16px;
    }

    .auth-card form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .password-field {
      position: relative;
      width: 100%;
    }

    .password-field input {
      padding-right: 48px;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: auto !important;
      min-width: 0 !important;
      height: auto !important;
      padding: 6px 8px !important;
      margin: 0 !important;
      border: none !important;
      border-radius: 8px !important;
      background: transparent !important;
      color: #8899aa !important;
      box-shadow: none !important;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      z-index: 2;
    }

    .password-toggle:hover {
      background: rgba(245, 166, 35, 0.08) !important;
      color: #f5a623 !important;
    }

    .utility-row {
      text-align: right;
      margin-top: 2px;
      margin-bottom: 4px;
    }

    .utility-row a {
      color: #f5a623;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .utility-row a:hover {
      text-decoration: underline;
    }

    .auth-card .secondary-text {
      text-align: center;
      margin-top: 10px;
    }

    .auth-card .secondary-text + .secondary-text {
      margin-top: 6px;
    }
  </style>
</head>
<body data-google-client-id="{{ config.GOOGLE_CLIENT_ID or google_client_id or '' }}">
  {% include '_nav.html' %}
  <div class="auth-container">
    <div class="auth-card">
      <p class="eyebrow">ANALOG CONTEST</p>
      <h1>Log In</h1>

      <form id="loginForm" novalidate>
        <div>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" required autocomplete="username" placeholder="Enter your username">
        </div>

        <div>
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter your password">
            <button type="button" id="togglePasswordBtn" class="password-toggle" title="Show/Hide password" aria-label="Show or hide password">👁️</button>
          </div>
        </div>

        <div class="utility-row">
          <a href="{{ url_for('auth.forgot_password_page') }}">Forgot Password?</a>
        </div>

        <button type="submit">Log In</button>
      </form>

      <div class="auth-separator">
        <span>Or continue with</span>
      </div>

      <div id="googleBtnContainer" class="google-btn-wrapper">
        <div id="googleBtn" class="google-btn-container"></div>
        <button id="customGoogleBtn" type="button" class="btn-google-custom">
          <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <div id="message" class="message"></div>

      <p class="secondary-text">No account yet? <a href="{{ url_for('auth.register_page') }}">Create an Account</a></p>
      <p class="secondary-text">Already registered? <a href="{{ url_for('auth.verify_email_page') }}">Verify Email</a></p>
    </div>
  </div>

  <script>
    window.google_client_id = "{{ config.GOOGLE_CLIENT_ID or google_client_id or '' }}";

    document.addEventListener('DOMContentLoaded', function() {
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const passInput = document.getElementById('password');

      if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passInput.type === 'password';
          passInput.type = isPassword ? 'text' : 'password';
          toggleBtn.textContent = isPassword ? '🙈' : '👁️';
        });
      }
    });
  </script>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="{{ url_for('static', filename='api_client.js') }}"></script>
  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
