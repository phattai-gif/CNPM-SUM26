<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả cuộc thi - Leaderboard</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
    {% include '_nav.html' %}
    <div class="page-shell">
        <h1 class="mb-3">Kết quả cuộc thi</h1>
        <p class="text-muted">Bảng xếp hạng cuối cùng và các tác phẩm đạt giải.</p>

        <section class="leaderboard">
            <h3>Leaderboard</h3>

            <div style="display:flex; gap:18px; margin-bottom:16px; align-items:center; justify-content:space-between;">
                <div>
                    <label for="round-id-input" class="text-muted">Round ID:</label>
                    <input id="round-id-input" type="number" class="round-input" />
                    <button id="load-leaderboard-btn" class="btn" style="margin-left:8px;">Tải bảng xếp hạng</button>
                </div>
                <div>
                    <button id="show-exhibits-btn" class="btn btn-outline">Xem Gallery đã xuất bản</button>
                </div>
            </div>

            <div id="winners-section" class="winners" aria-live="polite">
                <!-- Winners will be rendered here -->
            </div>

            <div id="leaderboard-table-wrap" class="table-responsive leaderboard">
                <table id="leaderboard-table" class="table">
                    <thead>
                                <tr>
                                    <th>Hạng</th>
                                    <th>Tác giả</th>
                                    <th>Tên bài</th>
                                    <th>Award</th>
                                    <th class="text-end">Tổng điểm</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                    <tbody id="leaderboard-body">
                        <tr><td colspan="6" class="empty-state">Chưa có dữ liệu. Vui lòng nhập `round_id` và bấm "Tải bảng xếp hạng".</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
    <script src="/static/api_client.js"></script>
    <script>
        function escapeHtml(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");}

        async function fetchLeaderboard(roundId){
            if(!roundId) throw new Error('roundId required');
            return await window.apiClient.get(`/organizer/rounds/${encodeURIComponent(roundId)}/leaderboard`);
        }

        function renderWinners(leaderboard){
            const container = document.getElementById('winners-section');
            container.innerHTML = '';
            const list = leaderboard || [];
            if(!list.length){ container.innerHTML = '<p class="empty-state">Không có người thắng.</p>'; return; }

            // Group by award_title (fallback to 'Overall')
            const groups = {};
            list.forEach(item => {
                const award = (item.award_title || item.award || item.award_name || 'Overall');
                groups[award] = groups[award] || [];
                groups[award].push(item);
            });

            Object.keys(groups).forEach(awardName => {
                const group = groups[awardName];
                // sort by rank
                group.sort((a,b)=> (a.rank||0) - (b.rank||0));

                const header = document.createElement('div');
                header.style.margin = '6px 0 8px';
                header.innerHTML = `<strong style="font-size:0.95rem;">${escapeHtml(awardName)}</strong>`;
                container.appendChild(header);

                const top = group.slice(0,3);
                const wrapper = document.createElement('div'); wrapper.className = 'winners';

                top.forEach((item, idx)=>{
                    const rank = item.rank || (idx+1);
                    const div = document.createElement('div'); div.className='winner';
                    div.innerHTML = `
                        <div style="display:flex;gap:12px;align-items:center;">
                            <div class="rank-badge rank-${rank}">${rank}</div>
                            <div>
                                <div style="font-weight:700; font-size:1rem;">#${escapeHtml(item.submission_id)} - ${escapeHtml(item.title||item.submission_title||'Untitled')}</div>
                                <div class="muted">Tác giả: ${escapeHtml(item.author||item.user_id||'-')} | Điểm: ${escapeHtml(item.final_score||item.total_score||'-')}</div>
                            </div>
                        </div>
                        <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
                            <button class="btn btn-success btn-sm approve-winner" data-id="${escapeHtml(item.submission_id)}">Approve</button>
                            <button class="btn btn-danger btn-sm reject-winner" data-id="${escapeHtml(item.submission_id)}">Reject</button>
                            <button class="btn btn-outline btn-sm publish-winner" data-id="${escapeHtml(item.submission_id)}">Publish to Gallery</button>
                            <button class="btn btn-secondary btn-sm archive-winner" data-id="${escapeHtml(item.submission_id)}">Archive</button>
                        </div>
                    `;
                    wrapper.appendChild(div);
                });

                container.appendChild(wrapper);
            });

            // attach handlers (single delegated approach)
            container.querySelectorAll('.approve-winner').forEach(b=>b.addEventListener('click', async (ev)=>{
                const btn = ev.currentTarget;
                const id = btn.dataset.id;
                if(!confirm('Xác nhận phê duyệt người thắng?')) return;
                btn.disabled = true; const orig = btn.innerText; btn.innerText = 'Approving...';
                    try{
                    await window.apiClient.post(`/organizer/submissions/${encodeURIComponent(id)}/approve-winner`);
                    btn.innerText = 'Approved'; btn.classList.remove('btn-success'); btn.classList.add('btn-outline');
                    // refresh leaderboard
                    if(typeof loadAndRender === 'function') setTimeout(loadAndRender, 300);
                }catch(e){
                    const msg = e && e.message ? e.message : String(e);
                    if(msg.toLowerCase().includes('permission')){
                        alert('Bạn cần đăng nhập với quyền organizer/admin. Chuyển tới trang đăng nhập.');
                        window.location.href = '/auth/login';
                        return;
                    }
                    alert('Failed to approve: ' + msg);
                    btn.disabled = false; btn.innerText = orig;
                }
            }));

            container.querySelectorAll('.reject-winner').forEach(b=>b.addEventListener('click', async (ev)=>{
                const btn = ev.currentTarget;
                const id = btn.dataset.id;
                if(!confirm('Xác nhận từ chối người thắng?')) return;
                btn.disabled = true; const orig = btn.innerText; btn.innerText = 'Rejecting...';
                    try{
                    await window.apiClient.post(`/organizer/submissions/${encodeURIComponent(id)}/reject-winner`);
                    btn.innerText = 'Rejected'; btn.classList.remove('btn-danger'); btn.classList.add('btn-outline');
                    if(typeof loadAndRender === 'function') setTimeout(loadAndRender, 300);
                }catch(e){
                    const msg = e && e.message ? e.message : String(e);
                    if(msg.toLowerCase().includes('permission')){ window.location.href = '/auth/login'; return; }
                    alert('Failed to reject: ' + msg);
                    btn.disabled = false; btn.innerText = orig;
                }
            }));

            container.querySelectorAll('.publish-winner').forEach(b=>b.addEventListener('click', async (ev)=>{
                const btn = ev.currentTarget;
                const id = btn.dataset.id;
                if(!confirm('Xuất bản tác phẩm này lên gallery công cộng?')) return;
                btn.disabled = true; const orig = btn.innerText; btn.innerText = 'Publishing...';
                    try{
                    const resp = await window.apiClient.post(`/organizer/submissions/${encodeURIComponent(id)}/publish`);
                    btn.innerText = 'Published'; btn.classList.remove('btn-outline'); btn.classList.add('btn');
                    // Optionally show exhibit id
                    if(resp && resp.exhibit_id) alert('Published to gallery (exhibit #' + resp.exhibit_id + ')');
                    if(typeof loadAndRender === 'function') setTimeout(loadAndRender, 300);
                }catch(e){
                    const msg = e && e.message ? e.message : String(e);
                    if(msg.toLowerCase().includes('permission')){ window.location.href = '/auth/login'; return; }
                    alert('Failed to publish: ' + msg);
                    btn.disabled = false; btn.innerText = orig;
                }
            }));

            container.querySelectorAll('.archive-winner').forEach(b=>b.addEventListener('click', async (ev)=>{
                const btn = ev.currentTarget;
                const id = btn.dataset.id;
                if(!confirm('Chuyển tác phẩm này vào kho lưu trữ (Archive)?')) return;
                btn.disabled = true; const orig = btn.innerText; btn.innerText = 'Archiving...';
                try{
                    const resp = await window.apiClient.post(`/organizer/submissions/${encodeURIComponent(id)}/archive`);
                    btn.innerText = 'Archived'; btn.classList.remove('btn-secondary'); btn.classList.add('btn-outline');
                    if(typeof loadAndRender === 'function') setTimeout(loadAndRender, 300);
                }catch(e){
                    const msg = e && e.message ? e.message : String(e);
                    if(msg.toLowerCase().includes('permission')){ window.location.href = '/auth/login'; return; }
                    alert('Failed to archive: ' + msg);
                    btn.disabled = false; btn.innerText = orig;
                }
            }));
        }

        function renderLeaderboardTable(leaderboard){
            const body = document.getElementById('leaderboard-body');
            if(!leaderboard || !leaderboard.length){ body.innerHTML = '<tr><td colspan="6" class="empty-state">Không có dữ liệu.</td></tr>'; return; }
            body.innerHTML = leaderboard.map(item=>{
                const title = escapeHtml(item.title||item.submission_title||'Untitled');
                const author = escapeHtml(item.author||item.user_id||'-');
                const score = escapeHtml(item.final_score||item.total_score||'-');
                const award = escapeHtml(item.award_title || item.award || '-');
                return `<tr>
                    <td>${escapeHtml(item.rank)}</td>
                    <td>${author}</td>
                    <td>${title}</td>
                    <td>${award}</td>
                    <td class="text-end">${score}</td>
                    <td>
                        <button class="btn btn-success btn-sm approve-row" data-id="${escapeHtml(item.submission_id)}">Approve</button>
                        <button class="btn btn-danger btn-sm reject-row" data-id="${escapeHtml(item.submission_id)}">Reject</button>
                        <button class="btn btn-outline btn-sm publish-row" data-id="${escapeHtml(item.submission_id)}">Publish</button>
                        <button class="btn btn-secondary btn-sm archive-row" data-id="${escapeHtml(item.submission_id)}">Archive</button>
                    </td>
                </tr>`;
            }).join('');

            // attach handlers with confirmation + error handling
            document.querySelectorAll('.approve-row').forEach(b=>b.addEventListener('click', async (ev)=>{ 
                const btn = ev.currentTarget; const id = btn.dataset.id; if(!confirm('Xác nhận phê duyệt người thắng?')) return; btn.disabled = true; const orig = btn.innerText; btn.innerText = 'Approving...';
                try{ await window.apiClient.post(`/organizer/submissions/${encodeURIComponent(id)}/approve-winner`); btn.innerText = 'Approved'; btn.classList.remove('btn-success'); btn.classList.add('btn-outline'); }catch(e){ const msg = e && e.message ? e.message : String(e); if(msg.toLowerCase().includes('permission')){ window.location.href = '/auth/login'; return; } alert('Failed to approve: '+msg); btn.disabled=false; btn.innerText=orig; }
            }));

            document.querySelectorAll('.reject-row').forEach(b=>b.addEventListener('click', async (ev)=>{ 
                const btn = ev.currentTarget; const id = btn.dataset.id; if(!confirm('Xác nhận từ chối người thắng?')) return; btn.disabled = true; const orig = btn.innerText; btn.innerText = 'Rejecting...';
                try{ await window.apiClient.post(`/organizer/submissions/${encodeURIComponent(id)}/reject-winner`); btn.innerText = 'Rejected'; btn.classList.remove('btn-danger'); btn.classList.add('btn-outline'); }catch(e){ const msg = e && e.message ? e.message : String(e); if(msg.toLowerCase().includes('permission')){ window.location.href = '/auth/login'; return; } alert('Failed to reject: '+msg); btn.disabled=false; btn.innerText=orig; }
            }));

            document.querySelectorAll('.publish-row').forEach(b=>b.addEventListener('click', async (ev)=>{ 
                const btn = ev.currentTarget; const id = btn.dataset.id; if(!confirm('Xuất bản tác phẩm này lên gallery công cộng?')) return; btn.disabled = true; const orig = btn.innerText; btn.innerText = 'Publishing...';
                try{ const resp = await window.apiClient.post(`/organizer/submissions/${encodeURIComponent(id)}/publish`); btn.innerText = 'Published'; btn.classList.remove('btn-outline'); btn.classList.add('btn'); if(resp && resp.exhibit_id) alert('Published to gallery (exhibit #'+resp.exhibit_id+')'); if(typeof loadAndRender === 'function') setTimeout(loadAndRender,300);}catch(e){ const msg = e && e.message ? e.message : String(e); if(msg.toLowerCase().includes('permission')){ window.location.href = '/auth/login'; return; } alert('Failed to publish: '+msg); btn.disabled=false; btn.innerText=orig; }
            }));

            document.querySelectorAll('.archive-row').forEach(b=>b.addEventListener('click', async (ev)=>{
                const btn = ev.currentTarget; const id = btn.dataset.id; if(!confirm('Chuyển tác phẩm này vào kho lưu trữ (Archive)?')) return; btn.disabled = true; const orig = btn.innerText; btn.innerText = 'Archiving...';
                try{ await window.apiClient.post(`/organizer/submissions/${encodeURIComponent(id)}/archive`); btn.innerText = 'Archived'; btn.classList.remove('btn-secondary'); btn.classList.add('btn-outline'); if(typeof loadAndRender === 'function') setTimeout(loadAndRender,300);}catch(e){ const msg = e && e.message ? e.message : String(e); if(msg.toLowerCase().includes('permission')){ window.location.href = '/auth/login'; return; } alert('Failed to archive: '+msg); btn.disabled=false; btn.innerText=orig; }
            }));
        }

        async function loadAndRender(){
            const roundId = document.getElementById('round-id-input').value || new URLSearchParams(window.location.search).get('round_id');
            if(!roundId){ alert('Vui lòng nhập round_id'); return; }
            try{
                const data = await fetchLeaderboard(roundId);
                const leaderboard = data && data.leaderboard ? data.leaderboard : (data.results || []);
                renderWinners(leaderboard);
                renderLeaderboardTable(leaderboard);
            }catch(e){
                alert(e.message||e);
            }
        }

        document.getElementById('load-leaderboard-btn').addEventListener('click', loadAndRender);
        document.getElementById('show-exhibits-btn').addEventListener('click', async ()=>{
            try{
                const resp = await window.apiClient.get('/organizer/exhibits');
                const list = resp.exhibits || [];
                const html = list.map(e=>{
                    const img = e.image_url ? `<img src="${escapeHtml(e.image_url)}" style="max-width:160px;display:block;margin-bottom:6px;border-radius:6px;"/>` : '';
                    return `<div class="winner" style="display:block;">${img}<div>Exhibit #${e.id} - submission ${e.submission_id}</div><div class="muted">Published: ${e.published_at || ''}</div></div>`
                }).join('');
                const container = document.getElementById('winners-section');
                container.innerHTML = html || '<p class="empty-state">Chưa có gallery nào được xuất bản.</p>';
            }catch(e){ alert(e.message||e); }
        });

        // auto-load if round_id present in URL
        (function(){ const qs = new URLSearchParams(window.location.search); const r = qs.get('round_id'); if(r){ document.getElementById('round-id-input').value = r; loadAndRender(); }})();
    </script>
</html>
