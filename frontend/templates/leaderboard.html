<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả cuộc thi - Leaderboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #080c14 !important;
            padding: 24px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            color: #e8edf2 !important;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #f0f4f8 !important;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .text-muted {
            color: #8899aa !important;
        }

        /* ===== WINNERS SECTION ===== */
        .winners {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .winner {
            background: #111a26 !important;
            border: 1px solid #1e2a3a !important;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            flex: 1;
            min-width: 200px;
        }

        .rank-badge {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 700;
            flex-shrink: 0;
        }
        .rank-1 { background: #f5a623 !important; color: #080c14 !important; }
        .rank-2 { background: #9ca3af !important; color: #080c14 !important; }
        .rank-3 { background: #cd7f32 !important; color: #fff !important; }

        /* ===== LEADERBOARD TABLE ===== */
        .leaderboard {
            background: #111a26 !important;
            border: 1px solid #1e2a3a !important;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .leaderboard h3 {
            color: #f0f4f8 !important;
            font-weight: 600;
            margin: 0 0 16px;
        }

        .table {
            border-collapse: collapse;
            background: #111a26 !important;
            width: 100%;
            margin-bottom: 0;
        }

        .table thead th {
            background: #0d1622 !important;
            color: #f5a623 !important;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            border-bottom: 2px solid #1e2a3a !important;
            padding: 14px 16px !important;
        }

        .table tbody tr {
            background: #111a26 !important;
            border-bottom: 1px solid #1e2a3a !important;
        }

        /* Ép toàn bộ chữ trong bảng hiển thị màu trắng sáng rõ nét */
        .table tbody td {
            color: #f0f4f8 !important;
            padding: 14px 16px !important;
            background: transparent !important;
        }

        .table tbody td:first-child {
            font-weight: 700;
            color: #f5a623 !important;
        }

        .text-end {
            text-align: right;
        }
    </style>
</head>
<body>
    {% include '_nav.html' %}
    <div class="container">
        <h1 class="mb-3">Kết quả cuộc thi</h1>
        <p class="text-muted">Bảng xếp hạng cuối cùng và các tác phẩm đạt giải.</p>

        <section class="leaderboard">
            <h3>Leaderboard</h3>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Hạng</th>
                            <th>Tác giả</th>
                            <th>Tên bài</th>
                            <th class="text-end">Tổng điểm</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Nguyễn Thị C</td>
                            <td>Hoàng hôn trên sông</td>
                            <td class="text-end">97</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Trần Văn D</td>
                            <td>Bến cảng sớm mai</td>
                            <td class="text-end">92</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>Lê Văn E</td>
                            <td>Mưa rơi phố nhỏ</td>
                            <td class="text-end">89</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
</html>
