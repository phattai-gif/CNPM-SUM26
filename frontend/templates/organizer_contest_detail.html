<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết cuộc thi - Quản lý</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --ui-ease: 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .action-btn {
            transition: transform var(--ui-ease), box-shadow var(--ui-ease), background-color var(--ui-ease), border-color var(--ui-ease);
        }

        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(13, 110, 253, 0.15);
        }

        #submissions-tbody tr {
            transition: transform var(--ui-ease), box-shadow var(--ui-ease), background-color var(--ui-ease);
        }

        #submissions-tbody tr:hover {
            transform: translateY(-1px);
            background-color: #f8fbff;
            box-shadow: inset 3px 0 0 #0d6efd;
        }

        .page-loader {
            position: fixed;
            inset: 0;
            z-index: 1080;
            background: rgba(248, 249, 250, 0.7);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .page-loader.show {
            display: flex;
            animation: fadeIn 180ms ease-in;
        }

        .toast-wrap {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1090;
            width: min(90vw, 360px);
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .app-toast {
            border-radius: 0.8rem;
            padding: 0.8rem 0.95rem;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.16);
            color: #fff;
            transform: translateY(-6px);
            opacity: 0;
            transition: transform var(--ui-ease), opacity var(--ui-ease);
        }

        .app-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .app-toast.success {
            background: linear-gradient(135deg, #198754, #157347);
        }

        .app-toast.warning {
            background: linear-gradient(135deg, #fd7e14, #e86a00);
        }

        .app-toast.error {
            background: linear-gradient(135deg, #dc3545, #b02a37);
        }

        .review-modal {
            position: fixed;
            inset: 0;
            z-index: 1070;
            background: rgba(15, 23, 42, 0.48);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .review-modal.show {
            display: flex;
            animation: fadeIn 180ms ease-in;
        }

        .review-modal-card {
            width: min(720px, 96vw);
            border-radius: 1rem;
            background: #fff;
            box-shadow: 0 16px 44px rgba(15, 23, 42, 0.22);
            transform: translateY(8px);
            opacity: 0;
            transition: transform var(--ui-ease), opacity var(--ui-ease);
        }

        .review-modal.show .review-modal-card {
            opacity: 1;
            transform: translateY(0);
        }

        .fade-page-out {
            animation: pageOut 220ms ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pageOut {
            to {
                opacity: 0;
                transform: translateY(2px);
            }
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/organizer/dashboard">Organizer Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/organizer/dashboard">Danh sách cuộc thi</a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="mb-3">
            <a href="/organizer/dashboard" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Quay lại Dashboard
            </a>
        </div>

        <!-- Khối Thông tin cuộc thi -->
        <div class="card shadow-sm mb-4">
            <div class="card-body" id="contest-info-container">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Đang tải thông tin cuộc thi...</p>
                </div>
            </div>
        </div>

        <!-- Khối Danh sách bài nộp -->
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0"><i class="bi bi-journal-check me-2"></i>Danh sách bài dự thi</h5>
                <button id="refresh-btn" class="btn btn-sm btn-outline-primary action-btn" onclick="loadContestData({ manual: true })">
                    <span class="spinner-border spinner-border-sm me-1 d-none" id="refresh-spinner" aria-hidden="true"></span>
                    <i class="bi bi-arrow-clockwise"></i> Làm mới
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-3">ID</th>
                                <th>TIÊU ĐỀ</th>
                                <th>LINK SẢN PHẨM</th>
                                <th>TRẠNG THÁI</th>
                                <th class="text-end pe-3">HÀNH ĐỘNG</th>
                            </tr>
                        </thead>
                        <tbody id="submissions-tbody">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">Đang tải danh sách bài nộp...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="page-loader" class="page-loader" aria-live="polite" aria-busy="true">
        <div class="text-center">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-secondary mt-2 mb-0" id="page-loader-text">Đang tải dữ liệu...</p>
        </div>
    </div>

    <div id="toast-wrap" class="toast-wrap"></div>

    <div id="submission-detail-modal" class="review-modal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="review-modal-card">
            <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">Chi tiết bài dự thi</h5>
                <button type="button" class="btn btn-sm btn-outline-secondary action-btn" onclick="closeSubmissionDetailModal()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="p-3 p-md-4">
                <div class="mb-2 text-muted small">ID: <span id="modal-submission-id">N/A</span></div>
                <h5 id="modal-submission-title" class="mb-3">Bài dự thi</h5>
                <div class="mb-3">
                    <span id="modal-submission-status" class="badge">submitted</span>
                </div>
                <div class="mb-4">
                    <div class="text-muted small mb-1">Link sản phẩm</div>
                    <a id="modal-submission-link" href="#" target="_blank" rel="noopener noreferrer" class="text-break">Chưa có link</a>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-light action-btn" onclick="closeSubmissionDetailModal()">Đóng</button>
                    <button type="button" class="btn btn-primary action-btn" id="go-review-btn" onclick="goToReviewFromModal()">
                        Chi tiết / Review
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const contestId = urlParams.get('contest_id') || urlParams.get('id');
        let submissionCache = [];
        let activeSubmissionId = null;

        function setPageLoading(isLoading, message = 'Đang tải dữ liệu...') {
            const loader = document.getElementById('page-loader');
            const text = document.getElementById('page-loader-text');
            if (text) text.textContent = message;
            if (!loader) return;
            loader.classList.toggle('show', isLoading);
        }

        function setRefreshLoading(isLoading) {
            const refreshBtn = document.getElementById('refresh-btn');
            const spinner = document.getElementById('refresh-spinner');
            if (!refreshBtn || !spinner) return;
            refreshBtn.disabled = isLoading;
            spinner.classList.toggle('d-none', !isLoading);
        }

        function showToast(message, type = 'success') {
            const wrap = document.getElementById('toast-wrap');
            if (!wrap) return;

            const toast = document.createElement('div');
            toast.className = `app-toast ${type}`;
            toast.textContent = message;
            wrap.appendChild(toast);

            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 220);
            }, 2600);
        }

        function escapeHtml(input) {
            const source = String(input || '');
            return source
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function getStatusPresentation(statusValue) {
            const value = String(statusValue || 'submitted').toLowerCase();
            const map = {
                submitted: {
                    label: 'Chờ chấm',
                    className: 'bg-success-subtle text-success-emphasis border border-success'
                },
                draft: {
                    label: 'Bản nháp',
                    className: 'bg-secondary-subtle text-secondary-emphasis border border-secondary'
                }
            };

            return map[value] || {
                label: value,
                className: 'bg-warning-subtle text-warning-emphasis border border-warning'
            };
        }

        function openSubmissionDetailModal(submissionId) {
            const modal = document.getElementById('submission-detail-modal');
            const item = submissionCache.find((sub) => String(sub.id) === String(submissionId));
            if (!modal || !item) {
                showToast('Không tìm thấy dữ liệu bài dự thi để mở chi tiết', 'warning');
                return;
            }

            activeSubmissionId = item.id;
            const statusInfo = getStatusPresentation(item.status);

            document.getElementById('modal-submission-id').textContent = `#${item.id || 'N/A'}`;
            document.getElementById('modal-submission-title').textContent = item.title || `Bài dự thi #${item.id || ''}`;

            const statusEl = document.getElementById('modal-submission-status');
            statusEl.className = `badge ${statusInfo.className}`;
            statusEl.textContent = statusInfo.label;

            const linkEl = document.getElementById('modal-submission-link');
            if (item.product_link) {
                linkEl.href = item.product_link;
                linkEl.textContent = item.product_link;
            } else {
                linkEl.href = '#';
                linkEl.textContent = 'Chưa có link sản phẩm';
            }

            modal.classList.add('show');
            modal.setAttribute('aria-hidden', 'false');
        }

        function closeSubmissionDetailModal() {
            const modal = document.getElementById('submission-detail-modal');
            if (!modal) return;
            modal.classList.remove('show');
            modal.setAttribute('aria-hidden', 'true');
        }

        function smoothRedirect(url) {
            document.body.classList.add('fade-page-out');
            window.requestAnimationFrame(() => {
                window.location.assign(url);
            });
        }

        function goToReviewFromModal() {
            if (!activeSubmissionId) {
                showToast('Không xác định được mã bài dự thi', 'warning');
                return;
            }
            smoothRedirect(`/judge/review?submission_id=${encodeURIComponent(activeSubmissionId)}`);
        }

        function goToTask75Review(submissionId) {
            if (!submissionId) {
                showToast('Không xác định được mã bài dự thi', 'warning');
                return;
            }
            smoothRedirect(`/judge/review?submission_id=${encodeURIComponent(submissionId)}`);
        }

        async function loadContestData(options = {}) {
            const isManual = options.manual === true;
            setPageLoading(true, isManual ? 'Đang làm mới dữ liệu...' : 'Đang tải dữ liệu...');
            setRefreshLoading(true);

            if (!contestId) {
                document.getElementById('contest-info-container').innerHTML = 
                    `<div class="alert alert-danger m-0">Không tìm thấy mã cuộc thi (contest_id) trên URL!</div>`;
                document.getElementById('submissions-tbody').innerHTML = 
                    `<tr><td colspan="5" class="text-center py-3 text-danger">Không có tham số contest_id</td></tr>`;
                showToast('Không tìm thấy contest_id trên URL', 'error');
                setPageLoading(false);
                setRefreshLoading(false);
                return;
            }

            // 1. Lấy thông tin cuộc thi
            try {
                let contestRes = await fetch(`/organizer/contests/${contestId}`);
                if (!contestRes.ok) contestRes = await fetch(`/api/contests/${contestId}`);
                if (!contestRes.ok) contestRes = await fetch(`/api/contests/detail?contest_id=${contestId}`);

                if (contestRes.ok) {
                    const contestData = await contestRes.json();
                    renderContestInfo(contestData);
                } else {
                    showToast('Không tải được thông tin cuộc thi', 'warning');
                }
            } catch (err) {
                console.error("Lỗi lấy thông tin cuộc thi:", err);
                showToast('Lỗi kết nối khi tải thông tin cuộc thi', 'error');
            }

            // 2. Lấy danh sách bài nộp (Thử lần lượt các API endpoint của backend)
            let submissions = [];
            try {
                let subRes = await fetch(`/api/contests/${contestId}/submissions`);
                if (!subRes.ok) {
                    subRes = await fetch(`/organizer/contests/${contestId}/submissions`);
                }
                if (!subRes.ok) {
                    subRes = await fetch(`/submissions?contest_id=${contestId}`);
                }

                if (subRes.ok) {
                    const data = await subRes.json();
                    const rawList = Array.isArray(data)
                        ? data
                        : (data.submissions || data.contest_submissions || data.data || data.items || []);

                    submissions = rawList.map((sub) => {
                        const submissionId = sub.id || sub.submission_id || null;
                        const productLink = sub.submission_url || sub.image_hd_url || sub.link || sub.file_url || sub.url || '';

                        return {
                            id: submissionId,
                            title: sub.title || sub.submission_name || sub.name || (submissionId ? `Bài dự thi #${submissionId}` : 'Bài dự thi'),
                            product_link: productLink,
                            status: sub.status || 'submitted'
                        };
                    });
                } else {
                    showToast('Không tải được danh sách bài dự thi', 'warning');
                }
            } catch (err) {
                console.error("Lỗi lấy danh sách bài nộp:", err);
                showToast('Lỗi kết nối khi tải danh sách bài dự thi', 'error');
            }

            renderSubmissions(submissions);

            if (isManual) {
                showToast(`Đã làm mới ${submissions.length} bài dự thi`, 'success');
            }

            setPageLoading(false);
            setRefreshLoading(false);
        }

        function renderContestInfo(data) {
            const contest = data.contest || data;
            const statusBadge = contest.status === 'published' 
                ? '<span class="badge bg-success">Đã xuất bản</span>' 
                : '<span class="badge bg-secondary">Bản nháp</span>';

            document.getElementById('contest-info-container').innerHTML = `
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h3 class="fw-bold mb-1">${contest.title || 'Cuộc thi #' + contestId} ${statusBadge}</h3>
                        <p class="text-muted mb-2">${contest.description || 'Chưa có mô tả'}</p>
                        <small class="text-secondary">
                            <i class="bi bi-calendar-event me-1"></i> Bắt đầu: ${contest.start_date || contest.start || 'N/A'} 
                            | Kết thúc: ${contest.end_date || contest.end || 'N/A'}
                        </small>
                    </div>
                </div>
            `;
        }

        function renderSubmissions(list) {
            const tbody = document.getElementById('submissions-tbody');
            submissionCache = Array.isArray(list) ? list : [];

            if (!list || list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">Chưa có bài dự thi nào được nộp cho cuộc thi này.</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(sub => {
                const link = sub.product_link || '#';
                const isDrive = link.includes('drive.google.com');
                const subId = sub.id || 'N/A';
                const title = sub.title || 'Bài dự thi #' + subId;
                const status = sub.status || 'submitted';
                const statusInfo = getStatusPresentation(status);

                return `
                    <tr>
                        <td class="ps-3 fw-bold">#${subId}</td>
                        <td class="fw-medium">${escapeHtml(title)}</td>
                        <td>
                            ${link
                                ? `<a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-primary action-btn">
                                    <i class="bi ${isDrive ? 'bi-google-drive' : 'bi-box-arrow-up-right'} me-1"></i>
                                    ${isDrive ? 'Mở Google Drive' : 'Xem link'}
                                   </a>`
                                : '<span class="text-muted">Chưa có link</span>'}
                        </td>
                        <td>
                            <span class="badge ${statusInfo.className}">
                                ${escapeHtml(statusInfo.label)}
                            </span>
                        </td>
                        <td class="text-end pe-3">
                            <div class="d-inline-flex gap-2 flex-wrap justify-content-end">
                                <button type="button" class="btn btn-sm btn-outline-primary action-btn" onclick="openSubmissionDetailModal('${escapeHtml(subId)}')">
                                    Chi tiết
                                </button>
                                <button type="button" class="btn btn-sm btn-primary action-btn" onclick="goToTask75Review('${escapeHtml(subId)}')">
                                    Chấm điểm (Task 75)
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        document.getElementById('submission-detail-modal').addEventListener('click', (event) => {
            if (event.target.id === 'submission-detail-modal') {
                closeSubmissionDetailModal();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeSubmissionDetailModal();
            }
        });

        document.addEventListener('DOMContentLoaded', loadContestData);
    </script>
</body>
</html>
