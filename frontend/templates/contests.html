<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh sách cuộc thi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  {% include '_nav.html' %}
  <div class="container" style="padding-top:18px">
    <h1>Danh sách cuộc thi</h1>
    <p class="text-muted">Các cuộc thi đang mở cho người tham gia.</p>
    <div id="contestsList" class="row g-3"></div>
  </div>
  <script src="/static/api_client.js"></script>
  <script>
    async function loadContests(){
      try{
        const resp = await fetch('/api/contests');
        const payload = await resp.json();
        const list = document.getElementById('contestsList');
        list.innerHTML = '';
        if (!payload || !payload.contests || !payload.contests.length) {
          list.innerHTML = '<div class="col-12 text-muted">Không có cuộc thi nào.</div>';
          return;
        }
        payload.contests.forEach(c => {
          const col = document.createElement('div'); col.className='col-12 col-md-6';
          const card = document.createElement('div'); card.className='card';
          card.innerHTML = `<div class="card-body"><h5 class="card-title">${c.title}</h5><p class="card-text text-muted">${c.description || ''}</p><div><a class="btn btn-primary" href="/contest/${c.id}">Xem chi tiết</a></div></div>`;
          col.appendChild(card); list.appendChild(col);
        });
      }catch(e){
        console.error(e);
        document.getElementById('contestsList').innerHTML = '<div class="col-12 text-danger">Lỗi khi tải danh sách cuộc thi.</div>';
      }
    }
    loadContests();
  </script>
</body>
</html>
