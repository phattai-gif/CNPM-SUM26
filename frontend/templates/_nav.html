<header class="app-nav-header">
  <link rel="stylesheet" href="/static/admin.css">

  <div class="app-nav-wrap">
    <nav class="app-nav-left" aria-label="Main navigation">
      <a href="/contests" class="app-nav-link primary">Contests</a>
      <a href="/gallery" class="app-nav-link">Gallery</a>
      <a href="/leaderboard" class="app-nav-link">Leaderboard</a>
      <a href="/my-submissions" id="nav-submissions-link" class="app-nav-link is-hidden">My Submissions</a>
      <a href="/judge" id="nav-judge-link" class="app-nav-link is-hidden">Judge Area</a>
      <a href="/organizer/dashboard" id="nav-organizer-link" class="app-nav-btn app-nav-btn-solid">Manage</a>
      <button type="button" id="nav-notifications" class="app-nav-btn app-nav-btn-outline is-hidden" title="View fraud alerts">
        🔔 <span id="nav-notification-count" class="is-hidden">0</span>
      </button>
    </nav>

    <div id="nav-notification-panel" class="is-hidden" style="position:absolute;right:24px;top:58px;z-index:1400;width:min(420px,calc(100vw - 24px));max-height:500px;overflow:auto;background:#111a26;border:1px solid #1e2a3a;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:18px 14px 12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;">
        <strong style="color:#f0f4f8;font-size:1.15rem;">New Alerts</strong>
        <button type="button" id="nav-notification-clear-all" style="border:none;background:transparent;color:#f5a623;font-weight:700;cursor:pointer;padding:6px 8px;border-radius:8px;">Clear all</button>
      </div>
      <div id="nav-notification-list" style="display:grid;gap:10px;"></div>
    </div>

    <div class="app-nav-right" id="nav-right-auth">
      <a href="/auth/login" id="nav-login" class="app-nav-btn app-nav-btn-outline">Log In</a>
      <a href="/auth/register" id="nav-register" class="app-nav-btn app-nav-btn-solid">Sign Up</a>

      <a href="/profile" id="nav-profile-link" class="app-nav-btn app-nav-btn-outline is-hidden" title="View Profile & Portfolio">
        <span id="nav-avatar" style="margin-right: 6px; font-size: 1.1rem;">👤</span>
        <span id="nav-username" class="app-nav-user" style="padding:0; max-width:150px;"></span>
      </a>
      <button type="button" id="nav-logout" class="app-nav-btn app-nav-btn-outline is-hidden">Log Out</button>
    </div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="app-nav-wrap" style="padding-top: 0;">
        <div class="" style="width: 100%; display: grid; gap: 8px; margin-top: 10px;">
          {% for category, message in messages %}
            <div class="alert alert-{{ 'warning' if category == 'warning' else category }} mb-0" role="alert">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      </div>
    {% endif %}
  {% endwith %}

  <script>
    (function () {
      const tokenKey = 'authToken';
      const userKey = 'authUser';

      const organizerLink = document.getElementById('nav-organizer-link');
      const submissionsLink = document.getElementById('nav-submissions-link');
      const judgeLink = document.getElementById('nav-judge-link');
      const profileLink = document.getElementById('nav-profile-link');
      const loginLink = document.getElementById('nav-login');
      const registerLink = document.getElementById('nav-register');
      const usernameLabel = document.getElementById('nav-username');
      const logoutButton = document.getElementById('nav-logout');
      const notificationsButton = document.getElementById('nav-notifications');
      const notificationCount = document.getElementById('nav-notification-count');
      const notificationPanel = document.getElementById('nav-notification-panel');
      const notificationList = document.getElementById('nav-notification-list');
      const clearAllButton = document.getElementById('nav-notification-clear-all');

      function safeGetSession() {
        if (window.AuthSession && typeof window.AuthSession.getSession === 'function') {
          return window.AuthSession.getSession();
        }

        let user = null;
        let role = null;
        const token = sessionStorage.getItem(tokenKey) || localStorage.getItem(tokenKey);
        try {
          user = JSON.parse(sessionStorage.getItem(userKey) || localStorage.getItem(userKey) || 'null');
        } catch (error) {
          user = null;
        }

        role = sessionStorage.getItem('authRole') || localStorage.getItem('authRole') || (user && user.role) || null;

        if (token && (!role || !user)) {
          try {
            const parts = token.split('.');
            if (parts.length === 3) {
              const base64Url = parts[1];
              const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
              const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
              const payload = JSON.parse(jsonPayload);
              if (!role && payload.role) role = payload.role;
              if (!user) user = { id: payload.user_id, username: payload.username, role: payload.role };
            }
          } catch(e) {}
        }

        return {
          token,
          user,
          role
        };
      }

      function setHidden(element, hidden) {
        if (!element) return;
        element.classList.toggle('is-hidden', hidden);
      }

      function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, (character) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[character]));
      }

      function displayNameFromUser(user) {
        if (!user || typeof user !== 'object') {
          return 'Account';
        }

        return user.full_name || user.username || user.email || 'Account';
      }

      function renderByAuthState() {
        const session = safeGetSession();
        const isLoggedIn = Boolean(session && session.token);
        const role = String((session && session.role) || (session && session.user && session.user.role) || '').toLowerCase();
        const isManager = role === 'organizer' || role === 'admin';
        const isJudge = role === 'judge';

        if (organizerLink) {
          organizerLink.href = role === 'admin' ? '/admin/dashboard' : '/organizer/dashboard';
          organizerLink.textContent = role === 'admin' ? 'Admin Dashboard' : (role === 'organizer' ? 'Organizer Dashboard' : 'Manage');
        }

        setHidden(organizerLink, !(isLoggedIn && isManager));
        setHidden(submissionsLink, !(isLoggedIn && !isManager && !isJudge));
        setHidden(judgeLink, !(isLoggedIn && isJudge));
        setHidden(profileLink, !isLoggedIn);
        setHidden(loginLink, isLoggedIn);
        setHidden(registerLink, isLoggedIn);
        setHidden(usernameLabel, !isLoggedIn);
        setHidden(logoutButton, !isLoggedIn);
        setHidden(notificationsButton, !(isLoggedIn && isManager));

        if (isLoggedIn && usernameLabel) {
          usernameLabel.textContent = displayNameFromUser(session.user);
          usernameLabel.title = usernameLabel.textContent;
        }
      }

      function notificationKindLabel(type) {
        const normalized = String(type || '').toLowerCase();
        if (normalized.includes('ai')) return 'AI';
        if (normalized.includes('duplicate')) return 'Duplicate';
        if (normalized.includes('fraud')) return 'Fraud';
        return 'Alert';
      }

      function notificationAccent(type) {
        const normalized = String(type || '').toLowerCase();
        if (normalized.includes('ai')) return '#f5a623';
        if (normalized.includes('duplicate')) return '#60a5fa';
        if (normalized.includes('fraud')) return '#f87171';
        return '#f5a623';
      }

      function renderNotificationItem(item) {
        const title = escapeHtml(item.title || 'Alert');
        const body = escapeHtml(item.body || '');
        const type = escapeHtml(notificationKindLabel(item.type));
        const accent = notificationAccent(item.type);
        const itemId = escapeHtml(item.id);
        return `
          <div style="border:1px solid #233547;border-radius:12px;padding:12px 12px 10px;background:rgba(17,26,38,0.9);box-shadow:inset 0 1px 0 rgba(255,255,255,0.02);">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
              <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${accent};box-shadow:0 0 0 4px rgba(245,166,35,0.12);"></span>
                <strong style="color:${accent};font-size:0.88rem;letter-spacing:0.04em;text-transform:uppercase;">${type}</strong>
              </div>
              <button type="button" data-notification-id="${itemId}" class="notification-delete-btn" aria-label="Delete notification" style="border:none;background:transparent;color:#90a4b7;cursor:pointer;font-size:1.1rem;line-height:1;padding:2px 4px;">×</button>
            </div>
            <div style="margin-top:10px;color:#f0f4f8;font-size:0.95rem;font-weight:700;line-height:1.4;">${title}</div>
            <div style="margin-top:8px;color:#c9d4e0;font-size:0.86rem;line-height:1.6;white-space:pre-line;">${body}</div>
          </div>
        `;
      }

      async function loadNotifications() {
        const session = safeGetSession();
        if (!session.token || !notificationsButton || notificationsButton.classList.contains('is-hidden')) return;
        try {
          const response = await fetch('/notifications?unread_only=true', {
            headers: { Authorization: `Bearer ${session.token}`, Accept: 'application/json' }
          });
          if (!response.ok) return;
          const payload = await response.json();
          const notifications = payload.notifications || [];
          notificationCount.textContent = String(notifications.length);
          setHidden(notificationCount, notifications.length === 0);
          notificationList.innerHTML = notifications.length
            ? notifications.map(renderNotificationItem).join('')
            : '<div style="padding:12px 8px;color:#8899aa;font-size:.9rem;">No new alerts.</div>';

          notificationList.querySelectorAll('.notification-delete-btn').forEach((button) => {
            button.addEventListener('click', async () => {
              const id = button.getAttribute('data-notification-id');
              if (!id) return;
              try {
                const deleteResponse = await fetch(`/notifications/${id}`, {
                  method: 'DELETE',
                  headers: { Authorization: `Bearer ${session.token}`, Accept: 'application/json' }
                });
                if (deleteResponse.ok) {
                  await loadNotifications();
                }
              } catch (error) {
                console.warn('Unable to delete notification', error);
              }
            });
          });
        } catch (error) {
          console.warn('Unable to load notifications', error);
        }
      }

      async function clearAllNotifications() {
        const session = safeGetSession();
        if (!session.token) return;
        try {
          const response = await fetch('/notifications', {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${session.token}`, Accept: 'application/json' }
          });
          if (response.ok) {
            await loadNotifications();
          }
        } catch (error) {
          console.warn('Unable to clear notifications', error);
        }
      }

      function clearAuthStorage() {
        sessionStorage.removeItem('authToken');
        sessionStorage.removeItem('authUser');
        sessionStorage.removeItem('authRole');
      }

      if (logoutButton) {
        logoutButton.addEventListener('click', function () {
          if (window.AuthSession && typeof window.AuthSession.logout === 'function') {
            window.AuthSession.logout();
            return;
          }

          clearAuthStorage();
          window.location.href = '/auth/login';
        });
      }

      renderByAuthState();
      loadNotifications();

      if (notificationsButton) {
        notificationsButton.addEventListener('click', () => {
          notificationPanel.classList.toggle('is-hidden');
          loadNotifications();
        });
      }

      if (clearAllButton) {
        clearAllButton.addEventListener('click', () => {
          clearAllNotifications();
        });
      }

      window.addEventListener('pageshow', renderByAuthState);
    })();
  </script>
</header>
