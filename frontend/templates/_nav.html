<header class="app-nav-header">
  <style>
    /* ===== DARK MODE NAVIGATION ===== */
    .app-nav-header {
      background: #080c14;
      border-bottom: 1px solid #1a2636;
      padding: 12px 20px;
      margin-bottom: 18px;
    }

    .app-nav-wrap {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .app-nav-left,
    .app-nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ===== NAV LINKS ===== */
    .app-nav-link {
      text-decoration: none;
      color: #99abb8;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 8px;
      transition: background-color 180ms ease, color 180ms ease;
    }

    .app-nav-link:hover {
      background: rgba(245, 166, 35, 0.08);
      color: #f5a623;
    }

    .app-nav-link.primary {
      color: #f0f4f8;
      font-size: 1.02rem;
      font-weight: 700;
    }

    .app-nav-link.primary:hover {
      color: #f5a623;
    }

    /* ===== BUTTONS ===== */
    .app-nav-btn {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 600;
      border: 1px solid transparent;
      transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.2;
    }

    .app-nav-btn:hover {
      transform: translateY(-1px);
    }

    /* Outline button */
    .app-nav-btn-outline {
      color: #99abb8;
      background: transparent;
      border-color: #1e2a3a;
    }

    .app-nav-btn-outline:hover {
      background: rgba(245, 166, 35, 0.08);
      color: #f5a623;
      border-color: #f5a623;
    }

    /* Solid button (Đăng ký / Quản lý) */
    .app-nav-btn-solid {
      color: #080c14;
      background: #f5a623;
      box-shadow: 0 6px 14px rgba(245, 166, 35, 0.24);
    }

    .app-nav-btn-solid:hover {
      background: #e0960a;
      color: #080c14;
      box-shadow: 0 8px 20px rgba(245, 166, 35, 0.35);
    }

    /* ===== USER NAME ===== */
    .app-nav-user {
      color: #f0f4f8;
      font-weight: 700;
      padding: 8px 6px;
      max-width: 230px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== FLASH MESSAGES ===== */
    .alert {
      border-radius: 8px;
      padding: 10px 16px;
      margin: 0;
      font-size: 0.95rem;
    }

    .alert-warning {
      background: rgba(245, 166, 35, 0.12);
      color: #f5a623;
      border: 1px solid rgba(245, 166, 35, 0.25);
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .alert-info {
      background: rgba(56, 189, 248, 0.12);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    /* ===== UTILITY ===== */
    .is-hidden {
      display: none !important;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .app-nav-header {
        padding: 10px 14px;
      }

      .app-nav-wrap {
        gap: 10px;
      }

      .app-nav-left,
      .app-nav-right {
        width: 100%;
        flex-wrap: wrap;
      }

      .app-nav-btn,
      .app-nav-link {
        padding: 6px 10px;
        font-size: 0.85rem;
      }

      .app-nav-user {
        max-width: 140px;
        font-size: 0.85rem;
      }
    }
  </style>

  <div class="app-nav-wrap">
    <nav class="app-nav-left" aria-label="Điều hướng chính">
      <a href="/contests" class="app-nav-link primary">Danh sách cuộc thi</a>
      <a href="/leaderboard" class="app-nav-link">Bảng xếp hạng</a>
      <a href="/organizer/dashboard" id="nav-organizer-link" class="app-nav-btn app-nav-btn-solid">Quản lý</a>
    </nav>

    <div class="app-nav-right" id="nav-right-auth">
      <a href="/auth/login" id="nav-login" class="app-nav-btn app-nav-btn-outline">Đăng nhập</a>
      <a href="/auth/register" id="nav-register" class="app-nav-btn app-nav-btn-solid">Đăng ký</a>

      <span id="nav-username" class="app-nav-user is-hidden"></span>
      <button type="button" id="nav-logout" class="app-nav-btn app-nav-btn-outline is-hidden">Đăng xuất</button>
    </div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="app-nav-wrap" style="padding-top: 0;">
        <div style="width: 100%; display: grid; gap: 8px; margin-top: 10px;">
          {% for category, message in messages %}
            <div class="alert alert-{{ 'warning' if category == 'warning' else category }} mb-0" role="alert">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      </div>
    {% endif %}
  {% endwith %}

  <script>
    (function () {
      const tokenKey = 'authToken';
      const userKey = 'authUser';

      const organizerLink = document.getElementById('nav-organizer-link');
      const loginLink = document.getElementById('nav-login');
      const registerLink = document.getElementById('nav-register');
      const usernameLabel = document.getElementById('nav-username');
      const logoutButton = document.getElementById('nav-logout');

      function safeGetSession() {
        if (window.AuthSession && typeof window.AuthSession.getSession === 'function') {
          return window.AuthSession.getSession();
        }

        let user = null;
        let role = null;
        try {
          user = JSON.parse(localStorage.getItem(userKey) || 'null');
        } catch (error) {
          user = null;
        }

        role = localStorage.getItem('authRole') || sessionStorage.getItem('authRole') || (user && user.role) || null;

        return {
          token: localStorage.getItem(tokenKey),
          user,
          role
        };
      }

      function setHidden(element, hidden) {
        if (!element) return;
        element.classList.toggle('is-hidden', hidden);
      }

      function displayNameFromUser(user) {
        if (!user || typeof user !== 'object') {
          return 'Tài khoản';
        }

        return user.full_name || user.username || user.email || 'Tài khoản';
      }

      function renderByAuthState() {
        const session = safeGetSession();
        const isLoggedIn = Boolean(session && session.token);
        const role = String((session && session.role) || (session && session.user && session.user.role) || '').toLowerCase();
        const canManage = role === 'organizer' || role === 'admin';

        setHidden(organizerLink, !isLoggedIn || !canManage);
        setHidden(loginLink, isLoggedIn);
        setHidden(registerLink, isLoggedIn);
        setHidden(usernameLabel, !isLoggedIn);
        setHidden(logoutButton, !isLoggedIn);

        if (isLoggedIn && usernameLabel) {
          usernameLabel.textContent = displayNameFromUser(session.user);
          usernameLabel.title = usernameLabel.textContent;
        }
      }

      function clearAuthStorage() {
        localStorage.removeItem('authToken');
        localStorage.removeItem('authUser');
        localStorage.removeItem('authRole');
        sessionStorage.removeItem('authToken');
        sessionStorage.removeItem('authUser');
        sessionStorage.removeItem('authRole');
      }

      if (logoutButton) {
        logoutButton.addEventListener('click', function () {
          if (window.AuthSession && typeof window.AuthSession.logout === 'function') {
            window.AuthSession.logout();
            return;
          }

          clearAuthStorage();
          window.location.href = '/auth/login';
        });
      }

      renderByAuthState();

      // Đồng bộ trạng thái nav khi phiên đăng nhập thay đổi ở tab khác.
      window.addEventListener('storage', function (event) {
        if (event.key === 'authToken' || event.key === 'authUser' || event.key === 'authRole') {
          renderByAuthState();
        }
      });
    })();
  </script>
</header>
