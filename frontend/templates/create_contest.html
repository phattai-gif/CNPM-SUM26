<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Contest</title>
    <link rel="stylesheet" href="/static/auth.css">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #f3f6fb;
        color: #1f2937;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .page-shell {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 20px;
      }

      .panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        box-shadow: 0 12px 36px rgba(15, 23, 42, 0.06);
        padding: 28px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(2rem, 2.4vw, 2.6rem);
        color: #111827;
      }

      form {
        display: grid;
        gap: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #374151;
        font-weight: 600;
      }

      input, textarea {
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
        background: #fff;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      button {
        width: 100%;
        margin-top: 8px;
        border: none;
        border-radius: 12px;
        padding: 14px 16px;
        background: linear-gradient(135deg, #4f46e5, #2563eb);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div class="panel">
        <h1>Create New Contest</h1>
        <form method="post" action="/organizer/create-contest">
          <div>
            <label>Contest Title</label>
            <input type="text" name="title" required placeholder="Enter contest title" />
          </div>
          <div>
            <label>Description</label>
            <textarea name="description" placeholder="Add contest description"></textarea>
          </div>
          <div>
            <label>Start Date (YYYY-MM-DDTHH:MM:SS)</label>
            <input type="text" name="start_date" placeholder="2026-08-12T09:00:00" />
          </div>
          <div>
            <label>End Date (YYYY-MM-DDTHH:MM:SS)</label>
            <input type="text" name="end_date" placeholder="2026-08-20T18:00:00" />
          </div>
          <div>
            <button type="submit">Create Contest</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
