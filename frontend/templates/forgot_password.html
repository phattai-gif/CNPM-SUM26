<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Quên mật khẩu? Nhập email để nhận mã đặt lại mật khẩu.">
  <title>Quên mật khẩu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='recovery.css') }}">
</head>
<body>
  {% include '_nav.html' %}

  <div class="rp-wrapper">
    <div class="rp-card">

      <!-- Icon badge -->
      <div class="rp-icon-badge indigo">🔒</div>

      <!-- Header -->
      <div class="rp-tag">Password Recovery</div>
      <h1>Forgot Password?</h1>
      <p class="rp-subtitle">
        No worries! Enter your registered email address and we'll generate a
        secure reset token for you instantly.
      </p>

      <!-- Form -->
      <form id="forgotPasswordForm" novalidate>
        <div class="rp-field">
          <label for="email"><span class="lbl-icon">📧</span> Email Address</label>
          <div class="rp-input-wrap has-icon">
            <span class="rp-input-icon">✉️</span>
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
              placeholder="you@example.com"
            >
          </div>
        </div>

        <button type="submit" id="submitBtn" class="rp-btn primary" style="margin-top: 8px;">
          <span class="spin"></span>
          <span class="btn-text">Request Reset Token →</span>
        </button>
      </form>

      <!-- Status message -->
      <div id="message" class="rp-alert" role="alert">
        <span class="alert-icon" id="msgIcon"></span>
        <span id="msgText"></span>
      </div>

      <!-- Demo token reveal box -->
      <div id="demoTokenContainer" class="rp-token-box">
        <div class="tb-header">
          <span>✅</span>
          <span>Your Reset Token — Copy it below</span>
        </div>
        <textarea id="demoTokenText" readonly title="Click to select all"></textarea>
        <a id="goToResetLink" href="#" class="tb-link">
          🔑 Proceed to Reset Password
        </a>
      </div>

    </div><!-- /.rp-card -->

    <!-- Back link -->
    <p class="rp-back">
      Remember your password? <a href="{{ url_for('auth.login_page') }}">Back to Login</a>
    </p>
  </div><!-- /.rp-wrapper -->

  <script src="{{ url_for('static', filename='api_client.js') }}"></script>
  <script src="{{ url_for('static', filename='forgot_password.js') }}"></script>
</body>
</html>
